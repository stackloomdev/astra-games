name: ECS deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy main or roll back to a retained successful release
        type: choice
        options: [deploy, rollback]
        default: deploy
      release:
        description: Release ID from a successful deployment log (rollback only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ecs-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRA_BUILD_SHA: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify standalone release
        run: bash deploy/build.sh
      - name: Build diagnostics
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/astra-build-*.log; do
            if [[ -f "$log" ]]; then tail -n 60 "$log"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-release-${{ github.sha }}
          path: |
            dist/release.tar.gz
            dist/release.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    needs: build
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        env:
          ECS_INSTANCE_ID: ${{ vars.ECS_INSTANCE_ID }}
          ECS_REGION: ${{ vars.ECS_REGION }}
          KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          test -n "$ECS_INSTANCE_ID" || { echo '::error::Configure ECS_INSTANCE_ID Actions variable'; exit 1; }
          test -n "$ECS_REGION" || { echo '::error::Configure ECS_REGION Actions variable'; exit 1; }
          test -n "$KEY_ID" && test -n "$KEY_SECRET" || { echo '::error::Configure both ALIBABA_CLOUD_ACCESS_KEY_* Actions secrets'; exit 1; }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
        with:
          name: ecs-release-${{ github.sha }}
          path: dist
      - name: Install verified Workbench CLI
        run: |
          curl -fsSL --retry 3 https://workbench-cli.oss-cn-hangzhou.aliyuncs.com/install.sh -o "$RUNNER_TEMP/install-workbench.sh"
          bash "$RUNNER_TEMP/install-workbench.sh" --version 1.0.4
          workbench version
      - name: Publish transaction to ECS
        env:
          ECS_INSTANCE_ID: ${{ vars.ECS_INSTANCE_ID }}
          ECS_REGION: ${{ vars.ECS_REGION }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
          ROLLBACK_RELEASE: ${{ inputs.release }}
        run: python3 deploy/workbench-release.py
